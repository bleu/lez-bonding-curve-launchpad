[scaffold]
version = "0.2.0"

[repos.lez]
source = "https://github.com/logos-blockchain/logos-execution-zone.git"
pin = "a58fbce2ff48c58b7bb5001b1a27e64b9596ee3a"  # LEZ v0.2.0

[repos.spel]
source = "https://github.com/logos-co/spel.git"
pin = "0cb7e0980535af619482cf1c823f4d394b3ebd61"  # spel v0.6.0 (vendors LEZ v0.2.0)

[repos.basecamp]
source = "https://github.com/logos-co/logos-basecamp.git"
pin = "a746cdbc521f72ee22c5a4856fd17a9802bb9d69"
build = "nix-flake"
attr = "app"

[repos.lgpm]
source = "github:logos-co/logos-package-manager"
pin = "e5c25989861f4487c3dc8c7b3bc0062bcbc3221f"
build = "nix-flake"
attr = "cli"

[wallet]
home_dir = ".scaffold/wallet"

[framework]
kind = "default"
version = "0.1.0"

[framework.idl]
spec = "lssa-idl/0.1.0"
path = "idl"

[localnet]
port = 3040
risc0_dev_mode = true

[circuits]
version = "0.5.3"  # LEZ v0.2.0 pins circuits rev 2846ee7a == v0.5.3
