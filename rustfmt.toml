# Copied verbatim from logos-execution-zone v0.2.0, so diffs against the in-tree
# programs read the same way. Everything below `use_try_shorthand` is a nightly-only
# option: on the pinned stable toolchain rustfmt ignores it and says so on stderr.
edition = "2024"

newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
group_imports = "StdExternalCrate"
imports_granularity = "Crate"
normalize_comments = true
reorder_impl_items = true
wrap_comments = true
comment_width = 100
format_code_in_doc_comments = true
